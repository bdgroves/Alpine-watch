# ALPINE-WATCH lake catalog.
#
# Every lake is watched from space (Sentinel-2 colour and chlorophyll index,
# ice-out, Landsat surface temperature). Lakes with ground sampling in the
# Water Quality Portal also get those numbers as ground truth.
#
#   osm_name   the lake's name in OpenStreetMap; the outline is looked up by
#              name within 8 km of lat/lon (or, failing that, whatever water
#              polygon contains lat/lon)
#   kind       clear | glacial | saline | reservoir  (how to read its colour)
#   backcountry  true for lakes with no road and no regular ground sampling
#   wqp        look for ground samples in the Water Quality Portal
#
# Big lakes are sampled inside a 3 km circle around lat/lon, so the reading
# is the same patch of open water every time.

lakes:
  - id: lake_tahoe
    name: Lake Tahoe
    osm_name: Lake Tahoe
    range: Sierra Nevada
    state: CA/NV
    elevation_ft: 6225
    lat: 39.0968
    lon: -120.0324
    kind: clear
    wqp: true
    notes: The gold standard. UC Davis has measured its clarity since 1968.

  - id: fallen_leaf
    name: Fallen Leaf Lake
    osm_name: Fallen Leaf Lake
    range: Sierra Nevada
    state: CA
    elevation_ft: 6377
    lat: 38.8968
    lon: -120.0574
    kind: clear
    wqp: true
    notes: Tahoe's neighbour, a canary for nutrients in the basin.

  - id: donner_lake
    name: Donner Lake

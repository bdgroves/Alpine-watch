name: alpine-watch · ground truth & deploy

on:
  schedule:
    # Every Tuesday and Friday at 06:00 UTC (weekly during monitoring season)
    - cron: "0 6 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual run reason"
        required: false
        default: "manual trigger"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    name: Ground samples + deploy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: false
          locked: false

      - name: Ground samples (Water Quality Portal)
        run: |
          pixi run fetch 2>&1 | tee fetch.log
          grep "^=" fetch.log | sed 's/^/::notice::/' || true

      - name: Commit updated data + charts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "alpine-watch[bot]"
          git add docs/data/
          git diff --staged --quiet || git commit -m \
            "📡 auto: ground samples $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -q && git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: false
          user_name: "alpine-watch[bot]"
          user_email: "action@github.com"
          commit_message: "🏔️ deploy: alpine-watch dashboard update"
